<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MTI Korea Business OS - Archived Prototype</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 14px system-ui, sans-serif; color: #17201c; background: #f4f6f4; }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    aside { padding: 22px 16px; color: #eef4ef; background: #16231d; }
    strong, span { display: block; }
    aside span { margin-top: 4px; color: #9eafa5; font-size: 12px; }
    nav { display: grid; gap: 5px; margin-top: 30px; }
    button { padding: 10px 12px; border: 0; border-radius: 5px; text-align: left; color: inherit; background: transparent; }
    button:first-child { background: #2a3b33; }
    main { padding: 30px; }
    header { padding-bottom: 22px; border-bottom: 1px solid #dce2de; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 7px 0 0; color: #657069; }
    .empty { display: grid; min-height: 65vh; place-content: center; text-align: center; }
    .empty h2 { margin: 0; font-size: 17px; }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <strong>MTI Korea</strong>
      <span>Business Operating System</span>
      <nav aria-label="Archived module structure">
        <button>Executive Agent</button>
        <button>Projects</button>
        <button>Documents</button>
        <button>Client &amp; Data</button>
        <button>Knowledge Base</button>
        <button>Settings</button>
      </nav>
    </aside>
    <main>
      <header>
        <h1>Archived design reference</h1>
        <p>The production application is maintained at the repository root.</p>
      </header>
      <section class="empty">
        <h2>No prototype data retained</h2>
        <p>Fictional projects, people, metrics, reports, and conversations were removed.</p>
      </section>
    </main>
  </div>
</body>
</html>
