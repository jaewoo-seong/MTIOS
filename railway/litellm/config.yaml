model_list:
  # `model` comes from EXECUTIVE_MODEL, not a literal. It used to be pinned to
  # openrouter/anthropic/claude-3.5-haiku while lib/ai/model-policy.ts read
  # EXECUTIVE_MODEL for the Settings display — so changing that variable moved
  # the label and nothing else, and a premium reasoning model could not
  # actually be selected. Same class of bug as the OPENROUTER_FREE_MODEL one
  # below; fixed the same way.
  - model_name: executive_reasoning
    litellm_params: &executive
      model: os.environ/EXECUTIVE_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: executive_review
    litellm_params: *executive

  # premium_fallback is what an admin approves when free routes are exhausted,
  # so it reads its own variable — sharing the executive alias made "approve a
  # premium fallback" silently mean "use the executive model", which is not
  # necessarily the same choice. lib/ai/usage.ts already reads
  # PREMIUM_FALLBACK_MODEL; this makes that read meaningful.
  - model_name: premium_fallback
    litellm_params:
      model: os.environ/PREMIUM_FALLBACK_MODEL
      api_key: os.environ/OPENROUTER_API_KEY

  # Explicit aliases let an approved Settings revision change the real model
  # at runtime without a gateway redeploy. All worker models are free-tier
  # OpenRouter models; the logical route selects the specialized default.
  - model_name: free_research_nemotron
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: free_longform_nemotron
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: free_gemma_multilingual
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: free_gemma_structured
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: free_fast_nemotron
    litellm_params:
      model: openrouter/nvidia/nemotron-nano-9b-v2:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: worker_research
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: worker_creative
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: worker_writing
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: worker_editing
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: worker_structured
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: worker_translation
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: worker_fast
    litellm_params:
      model: openrouter/nvidia/nemotron-nano-9b-v2:free
      api_key: os.environ/OPENROUTER_API_KEY

  # OpenRouter is deliberately the only provider right now. NVIDIA entries
  # (worker_nvidia, and NVIDIA-backed embedding/reranking) were removed rather
  # than left pointing at unset NVIDIA_* variables, which would fail this
  # config at startup for no benefit.
  #
  # Consequence, stated plainly because it is a real capability loss:
  # multilingual_embedding and multilingual_reranking have NO entry here, and
  # OpenRouter serves no embedding models at all (its catalog outputs only
  # text, image, and audio). So semantic retrieval is unavailable and
  # lib/context/retrieval.ts falls back to lexical scoring — which it handles
  # deliberately, tagging results `lexical_fallback` rather than failing. To
  # restore semantic search, add an embedding provider here (NVIDIA NIM,
  # OpenAI, Voyage, Cohere) and set the matching model variable; nothing in
  # the app needs to change.

router_settings:
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 2
  retry_after: 5
  routing_strategy: simple-shuffle

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
