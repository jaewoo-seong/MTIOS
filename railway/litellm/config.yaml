model_list:
  - model_name: executive_reasoning
    litellm_params:
      model: os.environ/EXECUTIVE_REASONING_MODEL
      api_key: os.environ/EXECUTIVE_REASONING_API_KEY
  - model_name: executive_review
    litellm_params:
      model: os.environ/EXECUTIVE_REVIEW_MODEL
      api_key: os.environ/EXECUTIVE_REVIEW_API_KEY
  - model_name: worker_research
    litellm_params:
      model: os.environ/WORKER_RESEARCH_MODEL
      api_key: os.environ/WORKER_RESEARCH_API_KEY
  - model_name: worker_structured
    litellm_params:
      model: os.environ/WORKER_STRUCTURED_MODEL
      api_key: os.environ/WORKER_STRUCTURED_API_KEY
  - model_name: worker_fast
    litellm_params:
      model: os.environ/WORKER_FAST_MODEL
      api_key: os.environ/WORKER_FAST_API_KEY

router_settings:
  allowed_fails: 2
  num_retries: 2
  retry_after: 5
  routing_strategy: least-busy

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
