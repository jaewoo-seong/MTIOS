model_list:
  # `model` comes from EXECUTIVE_MODEL, not a literal. It used to be pinned to
  # openrouter/anthropic/claude-3.5-haiku while lib/ai/model-policy.ts read
  # EXECUTIVE_MODEL for the Settings display — so changing that variable moved
  # the label and nothing else, and a premium reasoning model could not
  # actually be selected. Same class of bug as the OPENROUTER_FREE_MODEL one
  # below; fixed the same way.
  - model_name: executive_reasoning
    litellm_params: &executive
      model: os.environ/EXECUTIVE_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: executive_review
    litellm_params: *executive

  # premium_fallback is what an admin approves when free routes are exhausted,
  # so it reads its own variable — sharing the executive alias made "approve a
  # premium fallback" silently mean "use the executive model", which is not
  # necessarily the same choice. lib/ai/usage.ts already reads
  # PREMIUM_FALLBACK_MODEL; this makes that read meaningful.
  - model_name: premium_fallback
    litellm_params:
      model: os.environ/PREMIUM_FALLBACK_MODEL
      api_key: os.environ/OPENROUTER_API_KEY

  # `model` is sourced from OPENROUTER_FREE_MODEL rather than a literal, so the
  # value the Settings page displays (lib/ai/model-policy.ts reads the same env
  # var) is guaranteed to be the model actually invoked, not just a label.
  - model_name: worker_research
    litellm_params: &openrouter_free
      model: os.environ/OPENROUTER_FREE_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: worker_creative
    litellm_params: *openrouter_free
  - model_name: worker_writing
    litellm_params: *openrouter_free
  - model_name: worker_editing
    litellm_params: *openrouter_free
  - model_name: worker_structured
    litellm_params: *openrouter_free
  - model_name: worker_translation
    litellm_params: *openrouter_free
  - model_name: worker_fast
    litellm_params: *openrouter_free

  # multilingual_embedding / multilingual_reranking previously had no entry at
  # all here, so every call failed and lib/context/retrieval.ts silently fell
  # back to lexical-only search — semantic retrieval was never actually
  # running. NVIDIA is the only credentialed provider for these two
  # capabilities (railway/README.md documents NVIDIA_EMBEDDING_MODEL and
  # NVIDIA_RERANKING_MODEL for exactly this); wiring them here doesn't change
  # that decision, it completes it.
  - model_name: multilingual_embedding
    litellm_params:
      model: os.environ/NVIDIA_EMBEDDING_MODEL
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: multilingual_reranking
    litellm_params:
      model: os.environ/NVIDIA_RERANKING_MODEL
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY

  # A reachable NVIDIA chat target for worker-style routes, kept under its own
  # model_name rather than merged into worker_research etc. On purpose: with
  # routing_strategy simple-shuffle, adding a second litellm_params entry
  # under an EXISTING model_name puts it straight into live rotation for that
  # route. The app has no per-request candidate-selection logic yet (see
  # lib/ai/model-policy.ts — `candidates` currently only gates quota math and
  # the Settings display, it never changes which model_name gets called), so
  # merging would start sending production traffic to NVIDIA the moment
  # NVIDIA_WORKER_MODEL is set, without the NVIDIA_PRODUCTION_APPROVED gate
  # actually being consulted at request time. This name lets NVIDIA_WORKER_MODEL
  # be tested directly (call requestLiteLLM("worker_nvidia", ...)) without
  # touching existing traffic. Wiring it into automatic selection is
  # follow-up app work, not a config change.
  - model_name: worker_nvidia
    litellm_params:
      model: os.environ/NVIDIA_WORKER_MODEL
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY

router_settings:
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 2
  retry_after: 5
  routing_strategy: simple-shuffle

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
